{{ define "main" }}
  {{ .Content }}
  {{ range site.RegularPages }}
    <section>
      {{ partial "date.html" (dict "page" .)}}
      <h1><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h1>
      {{ partial "tags.html" (dict "taxonomy" "tags" "page" .) }}
      {{ .Summary }}
    </section>
  {{ end }}
{{ end }}
